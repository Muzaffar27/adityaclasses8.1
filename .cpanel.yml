---
deployment:
  tasks:
    - export REPOPATH=/home/adityaclasses/repositories/adityaclasses8.1
    - export PROJECTPATH=/home/adityaclasses/adityaclasses_project
    - export PUBLICPATH=/home/adityaclasses/public_html
    - export PHP=/opt/cpanel/ea-php82/root/usr/bin/php
    - /bin/echo "Deploy started at $(/bin/date '+%Y-%m-%d %H:%M:%S')" > /home/adityaclasses/deploy_log.txt

    # Find composer
    - /usr/bin/find /usr /opt /home/adityaclasses -name "composer" 2>/dev/null >> /home/adityaclasses/deploy_log.txt

    # Backup .env and index.php
    - /bin/cp $PROJECTPATH/.env /home/adityaclasses/.env.backup
    - /bin/cp $PUBLICPATH/index.php /home/adityaclasses/index.php.backup

    # Clear project folder (except .env)
    - /bin/find $PROJECTPATH -mindepth 1 -not -name '.env' -delete

    # Copy new files from repo to project
    - /bin/cp -R $REPOPATH/. $PROJECTPATH

    # Restore .env
    - /bin/cp /home/adityaclasses/.env.backup $PROJECTPATH/.env

    # Clear public_html
    - /bin/find $PUBLICPATH -mindepth 1 -delete

    # Copy Laravel public folder to public_html
    - /bin/cp -R $PROJECTPATH/public/. $PUBLICPATH

    # Restore modified index.php
    - /bin/cp /home/adityaclasses/index.php.backup $PUBLICPATH/index.php

    - /bin/echo "Deploy finished at $(/bin/date '+%Y-%m-%d %H:%M:%S')" >> /home/adityaclasses/deploy_log.txt
